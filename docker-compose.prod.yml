# The self-hosted deploy target. apps/deploy-hook runs
# `docker compose -f docker-compose.prod.yml up -d --build <service>` against
# this file with DOCKER_HOST pointed at the target host over SSH — see
# apps/deploy-hook/README.md.
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 8787
      ELASTIC_APM_SERVER_URL: ${ELASTIC_APM_SERVER_URL:-}
      ELASTIC_APM_SECRET_TOKEN: ${ELASTIC_APM_SECRET_TOKEN:-}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
      ELASTICSEARCH_API_KEY: ${ELASTICSEARCH_API_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - api-data:/data
    ports:
      - "8787:8787"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
