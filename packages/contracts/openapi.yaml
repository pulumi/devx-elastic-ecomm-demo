openapi: 3.0.3
info:
  title: Shopfront API
  version: 0.1.0
  description: >
    Product catalog, cart, checkout, and order endpoints for the Shopfront
    storefront. Owned jointly by the web and api workstreams; changes here
    require review from both.
servers:
  - url: /api

paths:
  /products:
    get:
      summary: List / search the product catalog
      operationId: listProducts
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Free-text search term
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
                  total: { type: integer }

  /products/{id}:
    get:
      summary: Get a single product
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404":
          description: Not found

  /cart:
    get:
      summary: Fetch the current cart for a session
      operationId: getCart
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/items:
    post:
      summary: Add an item to the cart
      operationId: addCartItem
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, qty]
              properties:
                productId: { type: string }
                qty: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /cart/items/{itemId}:
    patch:
      summary: Update a cart item's quantity
      operationId: updateCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: X-Session-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qty]
              properties:
                qty: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      summary: Remove a cart item
      operationId: removeCartItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
        - name: X-Session-Id
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }

  /checkout:
    post:
      summary: Convert the current cart into an order
      operationId: checkout
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400":
          description: Cart empty or invalid

  /orders:
    get:
      summary: Order history
      operationId: listOrders
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Orders for the given email
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Order" }

  /orders/{id}:
    get:
      summary: Order detail
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404":
          description: Not found

components:
  schemas:
    Product:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        name: { type: string }
        description: { type: string }
        priceCents: { type: integer }
        currency: { type: string, example: USD }
        inventoryCount: { type: integer }
        imageUrl: { type: string }

    CartItem:
      type: object
      properties:
        id: { type: string }
        productId: { type: string }
        name: { type: string }
        priceCents: { type: integer }
        qty: { type: integer }

    Cart:
      type: object
      properties:
        id: { type: string }
        sessionId: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotalCents: { type: integer }

    OrderItem:
      type: object
      properties:
        productId: { type: string }
        name: { type: string }
        qty: { type: integer }
        unitPriceCents: { type: integer }

    Order:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        status: { type: string, enum: [pending, paid, fulfilled, cancelled] }
        totalCents: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        createdAt: { type: string, format: date-time }
